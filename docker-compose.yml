version: "3.9"
name: hermit-claw

networks:
  openclaw-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

services:
  openclaw-gateway:
    build:
      context: ./agents/openclaw
      dockerfile: Dockerfile.gateway
    container_name: openclaw-gateway
    restart: unless-stopped
    networks:
      openclaw-network:
        ipv4_address: 172.30.0.10
    ports:
      - "19790:18790"
    volumes:
      - ./config/openclaw:/agent-config:ro
    environment:
      - OPENCLAW_GATEWAY_TOKEN=2ac145e2572b9b2fb44717b520c22588858403a75d4a6ea2

  control-19080:
    build:
      context: .
      dockerfile: control/Dockerfile
    container_name: hermit-control-19080
    restart: unless-stopped
    ports:
      - "19080:8080"
    environment:
      # 注意：这里**故意不再**用 ${PWD} 传宿主机路径。
      # ${PWD} 取的是「执行 compose 的那个 shell 的环境变量」：从别的目录跑 compose
      # （例如在 DSH checkout 里 docker compose -f .../hermitclaw/docker-compose.yml up）
      # 会把它烤成那个目录，之后新建/重建的卡片会把 /agent-config、/config、workspace
      # 全挂到错误甚至空的目录上（实测：Hub 卡片挂到空目录后 web 服务直接起不来）。
      # control 改为以自己容器的 /config、/workspaces 挂载源反推宿主机根目录（最可靠）。
      # 确需强制指定时，才在这里显式加 HOST_CONFIG_ROOT / HOST_WORKSPACES_ROOT / HOST_TOOLS_ROOT。
      - PUBLIC_PREVIEW_BASE_URL=http://dimond.top
      - OPENCLAW_GATEWAY_HOST=172.30.0.10
      - OPENCLAW_GATEWAY_PORT=18790
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config
      - ./workspaces:/workspaces
      - ./logs:/logs
      - ./logs/hermit:/logs/hermit
      # 相对路径按 compose 文件所在目录解析，与 ${PWD} 无关
      - ../frpc:/Users/jimjiang/Downloads/frpc
      - ../frp:/Users/jimjiang/Downloads/frp
      - ./config/rules:/config/rules
    networks:
      - openclaw-network

  agent-image-claude:
    build:
      context: .
      dockerfile: agents/claude/Dockerfile
    image: hermit-agent-claude:latest
    profiles: ["templates"]
    command: ["sleep", "infinity"]

  agent-image-openclaw:
    build:
      context: .
      dockerfile: agents/openclaw/Dockerfile
    image: hermit-agent-openclaw-2026.2.9:latest
    profiles: ["templates"]
    command: ["sleep", "infinity"]

  agent-image-ollama:
    build:
      context: .
      dockerfile: agents/ollama/Dockerfile
    image: hermit-agent-ollama:latest
    profiles: ["templates"]
    command: ["sleep", "infinity"]

  ssh-gateway:
    build:
      context: ./agents/ssh-gateway
      dockerfile: Dockerfile
    container_name: hermit-ssh-gateway
    restart: unless-stopped
    ports:
      - "19800:8080"
    environment:
      - DOCKER_HOST=host.docker.internal
      - SSH_USER=agent
      - SSH_PASS=agent
    volumes:
      - ./config/rules:/config/rules:rw
    networks:
      - openclaw-network
