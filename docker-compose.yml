version: "3.9"
name: hermit-claw

networks:
  openclaw-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

services:
  openclaw-gateway:
    build:
      context: ./agents/openclaw
      dockerfile: Dockerfile.gateway
    container_name: openclaw-gateway
    restart: unless-stopped
    networks:
      openclaw-network:
        ipv4_address: 172.30.0.10
    ports:
      - "18790:18790"
    volumes:
      - ./config/openclaw:/agent-config:ro
    environment:
      - OPENCLAW_GATEWAY_TOKEN=2ac145e2572b9b2fb44717b520c22588858403a75d4a6ea2

  control-18080:
    build:
      context: ./control
    container_name: hermit-control-18080
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      - HOST_CONFIG_ROOT=${PWD}/config
      - HOST_WORKSPACES_ROOT=${PWD}/workspaces
      - PUBLIC_PREVIEW_BASE_URL=http://dimond.top
      - OPENCLAW_GATEWAY_HOST=172.30.0.10
      - OPENCLAW_GATEWAY_PORT=18790
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config
      - ./workspaces:/workspaces
      - ./logs:/logs
      - ./logs/hermit:/logs/hermit
      - /Users/jimjiang/Downloads/frpc:/Users/jimjiang/Downloads/frpc
      - ./config/rules:/config/rules
    networks:
      - openclaw-network

  agent-image-claude:
    build:
      context: .
      dockerfile: agents/claude/Dockerfile
    image: hermit-agent-claude:latest
    profiles: ["templates"]
    command: ["sleep", "infinity"]

  agent-image-openclaw:
    build:
      context: .
      dockerfile: agents/openclaw/Dockerfile
    image: hermit-agent-openclaw-2026.2.9:latest
    profiles: ["templates"]
    command: ["sleep", "infinity"]

  agent-image-ollama:
    build:
      context: .
      dockerfile: agents/ollama/Dockerfile
    image: hermit-agent-ollama:latest
    profiles: ["templates"]
    command: ["sleep", "infinity"]

  ssh-gateway:
    build:
      context: ./agents/ssh-gateway
      dockerfile: Dockerfile
    container_name: hermit-ssh-gateway
    restart: unless-stopped
    ports:
      - "18800:8080"
    environment:
      - DOCKER_HOST=host.docker.internal
      - SSH_USER=agent
      - SSH_PASS=agent
    volumes:
      - ./config/rules:/config/rules:rw
    networks:
      - openclaw-network
